# nuBuilder Next – checks on every push (B4 of the 0.8.207 review). Needs the project in a GitHub repository.
# lint: php -l, languages, unit tests, PHPStan, ESLint · mysql: new installation from nubuilder4.sql + browser smoke test · mssql:
# new installation from the SQL Server install scripts + smoke test; both jobs then run the in-app self-test with the sample application
# (php nucron.php selftest --sample --lang=en: saves, sub-form rows, deletes, audit, rights, notifications on the real database – 0.8.889).
name: ci
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'pdo_mysql, mbstring, zip, sodium' }
      - run: for f in $(git ls-files '*.php'); do php -l "$f" > /dev/null || exit 1; done
      - run: php dev/check_lang.php
      - run: php dev/tests/run.php
      - run: curl -sSL -o ../phpstan.phar https://github.com/phpstan/phpstan/releases/download/2.1.17/phpstan.phar && php ../phpstan.phar analyse -c dev/phpstan.neon --no-progress --memory-limit=1G
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      # ESLint 9 = the maintenance line (9.17.0 was marked unsupported on npm, 0.8.890); 10 changes the config defaults – not yet
      - run: npm install --no-save --prefix .. eslint@9.39.5 globals@15.14.0 && npx --prefix .. eslint -c dev/eslint.config.mjs assets/js

  mysql:
    runs-on: ubuntu-latest
    needs: lint
    services:
      mariadb:
        image: mariadb:10.11
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: nutest, MARIADB_USER: nu, MARIADB_PASSWORD: nu }
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
        with: { path: nunext }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'pdo_mysql, mbstring, zip, sodium' }
      - run: git clone --depth 1 https://github.com/nuBuilder/nuBuilder.git nub && mv nunext nub/nunext
      # a new installation as the installer makes it: empty database → nuBuilder Forte's nubuilder4.sql through the database set-up
      # (NuDbState::setUp – brought to 4.9, own tables, origin 'nunext', database steps); importing the dump by hand would leave a database
      # with nuBuilder Forte's tables that nuBuilder Next did not set up, and every page answers 503 (existing databases are blocked)
      - run: |
          cat > nub/nunext/nuconfig.php <<'PHP'
          <?php
          $nuConfigDBHost = "127.0.0.1"; $nuConfigDBName = "nutest"; $nuConfigDBUser = "nu"; $nuConfigDBPassword = "nu";
          $nuConfigDBGlobeadminUsername = "globeadmin"; $nuConfigDBGlobeadminPassword = "ci-globeadmin-pw";
          $nuConfigSecretKey = "ci-0123456789abcdef0123456789abcdef"; $nuConfigBaseURL = "http://127.0.0.1:8099/nunext";
          $nuConfigShowInstaller = false; $nuConfigDevMode = true;
          PHP
          cd nub/nunext && php -r 'require "core/nuapp.php"; $r = NuDbState::setUp("upload", "../nubuilder4.sql"); $s = NuDbState::check(); echo $r["imported"], " statements, state ", $s["state"], ", origin ", NuInstall::origin(), "\n"; exit($s["state"] === "ok" && !NuInstall::existingBlocked() ? 0 : 1);'
      - run: (cd nub && php -d display_errors=1 -d error_reporting=-1 -S 127.0.0.1:8099 -t . > ../srv.log 2>&1 &) && sleep 2
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: npm install -g playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: NODE_PATH=$(npm root -g) BASE=http://127.0.0.1:8099/nunext/ ADMIN_PW=ci-globeadmin-pw node nub/nunext/dev/tests/smoke.js
      # integration checks from inside the application (developer mode, sample application installed first); its PHP messages go into
      # srv.log, which the next step reads
      - name: Self-test
        run: cd nub/nunext && php -d display_errors=0 -d log_errors=1 -d error_log="$GITHUB_WORKSPACE/srv.log" -d error_reporting=-1 nucron.php selftest --sample --lang=en
      # (0.8.888) warnings, notices and deprecations of every request – also JSON calls the smoke test does not look into – fail the job
      - name: PHP messages in the server log
        if: always()
        run: |
          [ -f srv.log ] || { echo "no server log – the job stopped before the web server was started"; exit 0; }
          if grep -E "PHP (Fatal error|Parse error|Warning|Notice|Deprecated)" srv.log; then echo "::error::PHP messages in the server log (above)"; exit 1; fi
          echo "no PHP messages in the server log"
      - if: failure()
        run: cat srv.log 2>/dev/null || true

  mssql:
    runs-on: ubuntu-latest
    needs: lint
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: { ACCEPT_EULA: 'Y', MSSQL_SA_PASSWORD: 'Ci_Passw0rd!' }
        ports: ['1433:1433']
    steps:
      - uses: actions/checkout@v5
        with: { path: nunext }
      # pdo_sqlsrv talks to SQL Server only through Microsoft's ODBC driver – the runner image does not have it
      # (0.8.871) runner images often ship it, or at least Microsoft's package source with its key: then nothing is added – a second source
      # with another Signed-By stops apt, and gpg without --batch asks on the existing key file ("cannot open /dev/tty")
      - name: Microsoft ODBC Driver 18 for SQL Server
        run: |
          if dpkg -s msodbcsql18 > /dev/null 2>&1; then echo "msodbcsql18 already installed"; exit 0; fi
          if ! grep -rqs packages.microsoft.com /etc/apt/sources.list /etc/apt/sources.list.d/; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          fi
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'pdo_sqlsrv, sqlsrv, mbstring, zip, sodium' }
      # the service container has no health check: wait until SQL Server accepts the login (up to 2 minutes), then create the database
      - run: |
          php -r 'for ($i = 0; $i < 60; $i++) { try { $pdo = new PDO("sqlsrv:Server=127.0.0.1,1433;TrustServerCertificate=1", "sa", "Ci_Passw0rd!"); break; } catch (PDOException $e) { if ($i === 59 || str_contains($e->getMessage(), "IMSSP")) { fwrite(STDERR, $e->getMessage() . "\n"); exit(1); } sleep(2); } } $pdo->exec("CREATE DATABASE nutest"); echo "SQL Server ready\n";'
          cat > nunext/nuconfig.php <<'PHP'
          <?php
          $nuConfigDBType = "sqlsrv"; $nuConfigDBHost = "127.0.0.1"; $nuConfigDBPort = 1433; $nuConfigDBName = "nutest";
          $nuConfigDBUser = "sa"; $nuConfigDBPassword = "Ci_Passw0rd!"; $nuConfigDBTrustServerCertificate = true;
          $nuConfigDBGlobeadminUsername = "globeadmin"; $nuConfigDBGlobeadminPassword = "ci-globeadmin-pw";
          $nuConfigSecretKey = "ci-0123456789abcdef0123456789abcdef"; $nuConfigBaseURL = "http://127.0.0.1:8099";
          $nuConfigShowInstaller = false; $nuConfigDevMode = true;
          PHP
          cd nunext && php -r 'require "core/nuapp.php"; $r = NuDbState::setUp("scripts"); $s = NuDbState::check(); echo $r["imported"], " statements, state ", $s["state"], ", origin ", NuInstall::origin(), "\n"; exit($s["state"] === "ok" && !NuInstall::existingBlocked() ? 0 : 1);'
      - run: (cd nunext && php -d display_errors=1 -d error_reporting=-1 -S 127.0.0.1:8099 -t . > ../srv.log 2>&1 &) && sleep 2
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: npm install -g playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: NODE_PATH=$(npm root -g) BASE=http://127.0.0.1:8099/ ADMIN_PW=ci-globeadmin-pw node nunext/dev/tests/smoke.js
      # integration checks from inside the application (developer mode, sample application installed first); its PHP messages go into
      # srv.log, which the next step reads
      - name: Self-test
        run: cd nunext && php -d display_errors=0 -d log_errors=1 -d error_log="$GITHUB_WORKSPACE/srv.log" -d error_reporting=-1 nucron.php selftest --sample --lang=en
      # (0.8.888) warnings, notices and deprecations of every request – also JSON calls the smoke test does not look into – fail the job
      - name: PHP messages in the server log
        if: always()
        run: |
          [ -f srv.log ] || { echo "no server log – the job stopped before the web server was started"; exit 0; }
          if grep -E "PHP (Fatal error|Parse error|Warning|Notice|Deprecated)" srv.log; then echo "::error::PHP messages in the server log (above)"; exit 1; fi
          echo "no PHP messages in the server log"
      - if: failure()
        run: cat srv.log 2>/dev/null || true
