# nuBuilder Next – Docker image (0.8.1137): built from the repository and pushed to the GitHub Container Registry when a release is
# published (tag v0.8.x → image tags 0.8.x and latest; a pre-release gets only its version). By hand: Actions → docker → Run workflow.
name: docker
on:
  release: { types: [published] }
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ github.event.release.tag_name || github.ref }}' }
      - id: v
        run: |
          v=$(sed -n "s/^define('NU_VERSION', '\([0-9.]*\)');.*/\1/p" core/nuapp.php)
          repo=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          tags="$repo:$v"
          [ "${{ github.event.release.prerelease }}" != "true" ] && tags="$tags,$repo:latest"
          # while nuBuilder Next is an alpha, every release is a pre-release: "edge" always points to the newest
          tags="$tags,$repo:edge"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0
