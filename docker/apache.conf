# nuBuilder Next in Docker: the .htaccess files of the package protect its folders – they need AllowOverride
<Directory /var/www/html>
	AllowOverride All
	Options -Indexes +FollowSymLinks
	Require all granted
</Directory>
ServerTokens Prod
ServerSignature Off
# behind a reverse proxy with TLS: nuBuilder Next reads X-Forwarded-Proto itself (nu_https)
